serial:
  baudrate: 9600
  timeout: 1
  port_keywords:
    - "Arduino"
    - "CH340"
    - "USB-SERIAL"
    - "USB2.0-Serial"
    - "Dispositivo serie USB"

signal_processing:
  window_size: 5
  baseline_window: 50
  min_peak_interval: 0.3 
  rise_threshold_ratio: 0.5
  min_bpm: 40
  max_bpm: 180
  bpm_history_size: 5

cross_sensor:
  max_delay: 0.15